{% extends "base.html" %}

{% block title %}Create Help Request - Elderly & Disabled Helping System{% endblock %}

{% block content %}
<h1 class="mb-4">Create Help Request</h1>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow p-4">
            <form method="POST" action="{{ url_for('create_request') }}">
                <div class="mb-4">
                    <label for="request_type" class="form-label large-text fw-bold">Type of Help</label>
                    <select class="form-select form-select-lg" id="request_type" name="request_type" required>
                        <option value="">-- Select help type --</option>
                        {% for htype in help_types %}
                        <option value="{{ htype }}">{{ htype }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label for="description" class="form-label large-text fw-bold">Description</label>
                    <textarea class="form-control form-control-lg" id="description" name="description"
                              rows="5" required placeholder="Describe what help you need..."></textarea>
                </div>
                <div class="mb-4">
                    <label for="location" class="form-label large-text fw-bold">Location</label>
                    <input type="text" class="form-control form-control-lg" id="location" name="location"
                           required placeholder="Enter your location">
                </div>
                <div class="mb-4">
                    <label class="form-label large-text fw-bold">Emergency?</label>
                    <div class="d-flex gap-4">
                        <div class="form-check form-check-lg">
                            <input class="form-check-input" type="radio" name="emergency" id="emergency_no"
                                   value="no" checked>
                            <label class="form-check-label large-text" for="emergency_no">No</label>
                        </div>
                        <div class="form-check form-check-lg">
                            <input class="form-check-input" type="radio" name="emergency" id="emergency_yes"
                                   value="yes">
                            <label class="form-check-label large-text text-danger fw-bold" for="emergency_yes">Yes</label>
                        </div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-large w-100">
                    <i class="bi bi-send me-2"></i>SUBMIT HELP REQUEST
                </button>
            </form>
            <div class="text-center mt-3">
                <a href="{{ url_for('user_dashboard') }}" class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-arrow-left me-2"></i>Back to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
